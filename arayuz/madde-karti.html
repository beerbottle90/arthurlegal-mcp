<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>ArthurLegal · Madde kartı</title>
<!--
  tr_mevzuat_madde_getir için MCP Apps görünümü. Claude (web, masaüstü, mobil) aracın
  sonucunu bu kartla gösterir; modelin okuduğu JSON metni değişmez.

  Görsel dil: ArthurLegal Kullanıcı Rehberi (arthurlegal-marketing/sunum/kullanici-rehberi)
  renkleri ve etiket biçimi, Apple/Microsoft tarzı yumuşak yüzeylerle. Yazı tipi her
  cihazın kendi sistem yazısıdır (macOS/iOS'ta SF, Windows 11'de Segoe UI Variable,
  Android'de Roboto). Açık/koyu tema Claude'dan gelir: applyDocumentTheme <html data-theme>
  koyar; o gelene kadar cihazın tercihi geçerlidir.

  Madde metni ve atıf her zaman textContent ile yazılır; araç sonucundaki hiçbir değer
  HTML olarak yorumlanmaz.
-->
<style>
  /* Düzen: tek kart; üstte kimlik ve doğrulama durumu, ortada iOS ayarlar listesi gibi
     iç içe madde grupları, altta kaynak satırı ve iki kapsül düğme. */
  :root {
    --yuzey: #ffffff;
    --grup: #f7f5f0;
    --alan: rgb(224 178 76 / 0.11);
    --cizgi: rgb(13 24 38 / 0.09);
    --metin: #1d2939;
    --ikincil: #56657a;
    --soluk: #8592a5;
    --altin: #e0b24c;
    --altin-metin: #87621f;
    --birincil: #14233c;
    --birincil-yazi: #ffffff;
    --dolgu: rgb(118 118 128 / 0.12);
    --dolgu-ust: rgb(118 118 128 / 0.2);
    --nane-metin: #1f7a52;   --nane-zemin: #eaf6f0;
    --amber-metin: #87621f;  --amber-zemin: #fbf3e0;
    --kirmizi-metin: #b43d2a; --kirmizi-zemin: #fceeeb;
    --mavi-metin: #2c62b5;   --mavi-zemin: #edf3fd;
    --halka: rgb(44 98 181 / 0.35);
    --golge: 0 1px 2px rgb(13 24 38 / 0.05), 0 4px 16px rgb(13 24 38 / 0.06);

    --yazi: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI Variable Text",
            "Segoe UI Variable", "Segoe UI", system-ui, Roboto, "Helvetica Neue", Arial, sans-serif;
    --yazi-baslik: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI Variable Display",
                   "Segoe UI Variable", "Segoe UI", system-ui, Roboto, "Helvetica Neue", Arial, sans-serif;

    --k-kart: 20px;
    --k-grup: 14px;
    --k-alan: 12px;
    --k-hap: 999px;

    --guvenli-ust: 0px;
    --guvenli-sag: 0px;
    --guvenli-alt: 0px;
    --guvenli-sol: 0px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --yuzey: #1a202b;
      --grup: #232a37;
      --alan: rgb(224 178 76 / 0.12);
      --cizgi: rgb(255 255 255 / 0.09);
      --metin: #eef1f6;
      --ikincil: #aab4c3;
      --soluk: #7f8a9c;
      --altin-metin: #e7c26a;
      --birincil: #e0b24c;
      --birincil-yazi: #0d1826;
      --dolgu: rgb(118 118 128 / 0.24);
      --dolgu-ust: rgb(118 118 128 / 0.34);
      --nane-metin: #6fd3a4;   --nane-zemin: rgb(63 169 124 / 0.16);
      --amber-metin: #e7c26a;  --amber-zemin: rgb(224 178 76 / 0.15);
      --kirmizi-metin: #f08a78; --kirmizi-zemin: rgb(229 83 63 / 0.16);
      --mavi-metin: #8db8f5;   --mavi-zemin: rgb(94 155 239 / 0.16);
      --halka: rgb(141 184 245 / 0.45);
      --golge: 0 0 0 0.5px rgb(255 255 255 / 0.06);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --yuzey: #1a202b;
    --grup: #232a37;
    --alan: rgb(224 178 76 / 0.12);
    --cizgi: rgb(255 255 255 / 0.09);
    --metin: #eef1f6;
    --ikincil: #aab4c3;
    --soluk: #7f8a9c;
    --altin-metin: #e7c26a;
    --birincil: #e0b24c;
    --birincil-yazi: #0d1826;
    --dolgu: rgb(118 118 128 / 0.24);
    --dolgu-ust: rgb(118 118 128 / 0.34);
    --nane-metin: #6fd3a4;   --nane-zemin: rgb(63 169 124 / 0.16);
    --amber-metin: #e7c26a;  --amber-zemin: rgb(224 178 76 / 0.15);
    --kirmizi-metin: #f08a78; --kirmizi-zemin: rgb(229 83 63 / 0.16);
    --mavi-metin: #8db8f5;   --mavi-zemin: rgb(94 155 239 / 0.16);
    --halka: rgb(141 184 245 / 0.45);
    --golge: 0 0 0 0.5px rgb(255 255 255 / 0.06);
    color-scheme: dark;
  }

  /* Kart sohbetin üstünde durur: sayfa zemini saydam, gölgeye yer kalsın diye kenar boşluğu. */
  html, body { margin: 0; background: transparent; }
  /* Sınıf kuralları (display:flex) hidden özniteliğini ezmesin. */
  [hidden] { display: none !important; }
  body {
    font-family: var(--yazi);
    font-size: 15px;
    line-height: 1.5;
    color: var(--metin);
    padding: calc(var(--guvenli-ust) + 4px) calc(var(--guvenli-sag) + 4px)
             calc(var(--guvenli-alt) + 12px) calc(var(--guvenli-sol) + 4px);
    -webkit-font-smoothing: antialiased;
    -webkit-text-size-adjust: 100%;
  }

  .kart {
    display: flex;
    flex-direction: column;
    gap: 14px;
    padding: 16px;
    background: var(--yuzey);
    border: 0.5px solid var(--cizgi);
    border-radius: var(--k-kart);
    box-shadow: var(--golge);
  }

  /* ---- Üst: kimlik satırı, kanun adı, künye ---- */
  .kimlik { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .arma { flex: none; width: 30px; height: 30px; border-radius: 8px; display: block; box-shadow: 0 0 0 0.5px var(--cizgi); }
  .marka { font-weight: 700; font-size: 15px; letter-spacing: -0.01em; white-space: nowrap; }
  .marka span { color: var(--altin-metin); }
  .ayrac { width: 1px; height: 16px; background: var(--cizgi); flex: none; }
  .bolum { color: var(--ikincil); font-size: 14px; white-space: nowrap; }
  .durum {
    margin-left: auto;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 3px 10px 3px 8px;
    border-radius: var(--k-hap);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    white-space: nowrap;
    background: var(--dolgu);
    color: var(--ikincil);
  }
  .durum::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .durum.tamam { background: var(--nane-zemin); color: var(--nane-metin); }
  .durum.kismen { background: var(--amber-zemin); color: var(--amber-metin); }
  .durum.yok { background: var(--kirmizi-zemin); color: var(--kirmizi-metin); }

  .baslik-alani { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  h1 {
    margin: 0;
    font-family: var(--yazi-baslik);
    font-size: 20px;
    line-height: 1.25;
    font-weight: 650;
    letter-spacing: -0.015em;
    text-wrap: balance;
  }
  .kunye { color: var(--ikincil); font-size: 14px; font-variant-numeric: tabular-nums; }

  /* ---- Madde grupları ---- */
  #govde { display: flex; flex-direction: column; gap: 10px; }
  .madde {
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 14px;
    background: var(--grup);
    border-radius: var(--k-grup);
    min-width: 0;
  }
  .madde-bas { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
  .no {
    display: inline-flex;
    align-items: center;
    height: 24px;
    padding: 0 10px;
    border-radius: var(--k-hap);
    background: var(--altin);
    color: #0d1826;
    font-size: 13px;
    font-weight: 700;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  .baslik { font-weight: 600; font-size: 16px; line-height: 1.3; }
  .baslik.yok { font-weight: 400; color: var(--soluk); font-style: italic; font-size: 15px; }
  .rozet {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 3px 9px;
    border-radius: var(--k-hap);
    white-space: nowrap;
  }
  .rozet.kirmizi { background: var(--kirmizi-zemin); color: var(--kirmizi-metin); }
  .rozet.mavi { background: var(--mavi-zemin); color: var(--mavi-metin); }
  .rozet.amber { background: var(--amber-zemin); color: var(--amber-metin); }

  .metin { display: flex; flex-direction: column; gap: 8px; }
  .metin p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; max-width: 70ch; }
  .metin.kisa {
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 7;
    overflow: hidden;
  }
  .metin.kisa p + p { margin-top: 8px; }

  .notlar { display: flex; flex-wrap: wrap; gap: 6px; }
  .not {
    font-size: 12px;
    line-height: 1.4;
    padding: 3px 10px;
    border-radius: var(--k-hap);
    background: var(--dolgu);
    color: var(--ikincil);
  }

  .atif {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px 12px;
    padding: 10px 10px 10px 14px;
    border-radius: var(--k-alan);
    background: var(--alan);
  }
  .atif-icerik { flex: 1 1 220px; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .etiket {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--altin-metin);
  }
  .atif-metin { font-size: 14px; line-height: 1.4; overflow-wrap: anywhere; user-select: all; }

  .uyari {
    margin: 0;
    padding: 10px 14px;
    border-radius: var(--k-alan);
    background: var(--amber-zemin);
    color: var(--amber-metin);
    font-size: 14px;
    line-height: 1.45;
    overflow-wrap: anywhere;
  }
  .aciklama { margin: 0; font-size: 14px; color: var(--ikincil); }

  /* ---- Kapsül düğmeler ---- */
  button {
    font: inherit;
    font-size: 14px;
    font-weight: 500;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    min-height: 34px;
    padding: 0 14px;
    border: 0;
    border-radius: var(--k-hap);
    background: var(--dolgu);
    color: var(--metin);
    cursor: pointer;
    transition: background-color 120ms ease, transform 120ms ease, opacity 120ms ease;
    -webkit-tap-highlight-color: transparent;
  }
  button:hover { background: var(--dolgu-ust); }
  button:active { transform: scale(0.97); }
  button:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--halka); }
  button svg { width: 16px; height: 16px; flex: none; }
  button.birincil { background: var(--birincil); color: var(--birincil-yazi); font-weight: 600; }
  button.birincil:hover { opacity: 0.9; }
  button.duz {
    align-self: flex-start;
    min-height: 28px;
    padding: 0 2px;
    background: transparent;
    color: var(--altin-metin);
    font-weight: 600;
  }
  button.duz:hover { background: transparent; text-decoration: underline; text-underline-offset: 3px; }
  button.kucuk { min-height: 30px; padding: 0 12px; font-size: 13px; background: var(--yuzey); }
  button.kucuk:hover { background: var(--yuzey); opacity: 0.85; }

  @media (pointer: coarse) {
    button, button.kucuk { min-height: 44px; }
    button.duz { min-height: 40px; }
  }
  @media (prefers-reduced-motion: reduce) {
    button { transition: none; }
    button:active { transform: none; }
  }

  /* ---- Alt satır ---- */
  .alt { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 12px; }
  .zaman { color: var(--soluk); font-size: 12px; font-variant-numeric: tabular-nums; }
  .eylemler { display: flex; flex-wrap: wrap; gap: 8px; margin-left: auto; }

  /* ---- Yükleniyor iskeleti ---- */
  .iskelet { display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: var(--k-grup); background: var(--grup); }
  .iskelet i { display: block; height: 12px; border-radius: 6px; background: var(--dolgu); animation: nabiz 1.4s ease-in-out infinite; }
  .iskelet i:nth-child(1) { width: 38%; height: 16px; }
  .iskelet i:nth-child(3) { width: 90%; }
  .iskelet i:nth-child(4) { width: 62%; }
  @keyframes nabiz { 50% { opacity: 0.45; } }
  @media (prefers-reduced-motion: reduce) { .iskelet i { animation: none; } }

  .gizli { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>
</head>
<body>
<article class="kart" id="kart" aria-busy="true">
  <header class="kimlik">
    <!-- ArthurLegal arması: kimlik/logo/arthurlegal-2-navy-gold-clean'in 20x20 piksel ızgarası -->
    <svg class="arma" viewBox="0 0 20 20" shape-rendering="crispEdges" role="img" aria-label="ArthurLegal arması">
      <rect width="20" height="20" fill="#0e1b2a"/>
      <path fill="#e0b24c" d="M7 4h5v1h-5zM6 5h2v1h-2zM11 5h2v1h-2zM6 6h1v1h-1zM12 6h1v1h-1zM5 7h2v1h-2zM12 7h2v1h-2zM5 8h2v1h-2zM12 8h2v1h-2zM5 9h2v1h-2zM12 9h2v1h-2zM5 10h9v1h-9zM5 11h2v1h-2zM12 11h2v1h-2zM5 12h1v1h-1zM13 12h1v1h-1zM4 13h2v1h-2zM13 13h2v1h-2zM4 14h2v1h-2zM13 14h2v1h-2zM4 15h2v1h-2zM13 15h2v1h-2z"/>
      <path fill="#f4d58d" d="M7 3h5v1h-5zM6 4h1v1h-1zM12 4h1v1h-1zM5 6h1v1h-1zM13 6h1v1h-1zM7 9h5v1h-5zM4 12h1v1h-1zM14 12h1v1h-1z"/>
    </svg>
    <span class="marka">Arthur<span>Legal</span></span>
    <span class="ayrac" aria-hidden="true"></span>
    <span class="bolum">Mevzuat</span>
    <span class="durum" id="durum">Getiriliyor</span>
  </header>

  <div class="baslik-alani">
    <h1 id="kanun">Madde getiriliyor…</h1>
    <div class="kunye" id="kunye"></div>
  </div>

  <div id="govde">
    <div class="iskelet" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  </div>

  <footer class="alt" id="alt" hidden>
    <span class="zaman" id="zaman"></span>
    <div class="eylemler">
      <button type="button" id="kaynak-ac" hidden>
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.5 2.5h4v4M13.5 2.5 7.5 8.5M12 9.5v3a1 1 0 0 1-1 1H3.5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h3"/></svg>
        Resmî metin
      </button>
      <button type="button" id="hepsini-kopyala" class="birincil" hidden>
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5.5" y="5.5" width="8" height="8" rx="2"/><path d="M10.5 5.5V4a1.5 1.5 0 0 0-1.5-1.5H4A1.5 1.5 0 0 0 2.5 4v5A1.5 1.5 0 0 0 4 10.5h1.5"/></svg>
        <span>Metni kopyala</span>
      </button>
    </div>
  </footer>
  <div class="gizli" aria-live="polite" id="duyuru"></div>
</article>

<script>
  // Arayüz istemcisi yüklenemezse (ağ, içerik güvenlik politikası) kart sonsuza dek
  // "getiriliyor" demesin: madde metni sohbetteki araç sonucunda zaten duruyor.
  window.__alBagli = false;
  setTimeout(function () {
    if (window.__alBagli) return;
    var p = document.createElement("p");
    p.className = "aciklama";
    p.textContent = "Kart yüklenemedi. Madde metni ve atıf, sohbetteki araç sonucunda yer alıyor.";
    document.getElementById("govde").replaceChildren(p);
    document.getElementById("durum").textContent = "Yüklenemedi";
    document.getElementById("kart").removeAttribute("aria-busy");
  }, 12000);
</script>

<script type="module">
  // Resmî MCP Apps istemcisi, sürüm sabit. Sürüm değişirse sunucudaki CSP satırı aynı kalır
  // (unpkg.com); yalnız bu adres güncellenir.
  import { App, applyDocumentTheme } from "https://unpkg.com/@modelcontextprotocol/ext-apps@1.7.5/dist/src/app-with-deps.js";

  const RESMI_GIRIS = "https://www.mevzuat.gov.tr/";
  const UYARI = "UYARI: veri çekilemedi, teyidiniz gerekli: ";
  const DURUM_ROZETI = {
    repealed: ["Mülga", "kirmizi"],
    annulled: ["İptal", "kirmizi"],
    incorporated_elsewhere: ["Başka kanuna işlenmiş", "mavi"],
  };
  // Kanun adları kaynakta BÜYÜK HARFLE gelir; kartın başlığında okunaklı yazılır.
  // Atıf alanı ise kaynaktaki haliyle, birebir kalır.
  const KUCUK_KELIMELER = new Set(["ve", "ile", "veya", "ya", "da", "de"]);

  const $ = (id) => document.getElementById(id);
  const ogesi = (etiket, sinif, metin) => {
    const el = document.createElement(etiket);
    if (sinif) el.className = sinif;
    if (metin != null) el.textContent = metin;
    return el;
  };
  // Kopyala simgesi alt satırdaki düğmeden kopyalanır: tek çizim, her yerde aynı.
  const ikon = () => document.querySelector("#hepsini-kopyala svg").cloneNode(true);

  let sonVeri = null;
  let kaynakAdresi = RESMI_GIRIS;

  function baslikDuzeni(s) {
    return String(s || "")
      .toLocaleLowerCase("tr")
      .split(/\s+/)
      .filter(Boolean)
      .map((w, i) => (i > 0 && KUCUK_KELIMELER.has(w)) ? w : w.charAt(0).toLocaleUpperCase("tr") + w.slice(1))
      .join(" ");
  }

  function tarih(iso) {
    const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || "");
    return m ? `${m[3]}.${m[2]}.${m[1]}` : "";
  }

  function zaman(iso) {
    const d = new Date(iso);
    if (Number.isNaN(d.getTime())) return "";
    return d.toLocaleString("tr-TR", { dateStyle: "short", timeStyle: "short" });
  }

  function maddeEtiketi(no) {
    const m = /^(geçici|ek)\s+(.+)$/i.exec(String(no || "").trim());
    if (m) return `${m[1].charAt(0).toLocaleUpperCase("tr")}${m[1].slice(1).toLocaleLowerCase("tr")} m. ${m[2]}`;
    return `m. ${no}`;
  }

  // ---- Sonucu okuma: önce structuredContent, yoksa metin bloğundaki JSON ----
  function veriAl(sonuc) {
    if (sonuc && sonuc.structuredContent && typeof sonuc.structuredContent === "object") {
      return { veri: sonuc.structuredContent };
    }
    const metin = sonuc && Array.isArray(sonuc.content)
      ? sonuc.content.filter((b) => b && b.type === "text").map((b) => b.text).join("\n")
      : "";
    if (sonuc && sonuc.isError) return { hata: metin.replace(/^ERROR:\s*/, "") || "Araç hata döndürdü." };
    try {
      return { veri: JSON.parse(metin) };
    } catch {
      return { hata: metin || "Araç sonucu okunamadı." };
    }
  }

  // ---- Çizim ----
  function durumYaz(basarili, toplam) {
    const d = $("durum");
    d.className = "durum " + (toplam && basarili === toplam ? "tamam" : basarili ? "kismen" : "yok");
    d.textContent = toplam && basarili === toplam ? "Doğrulandı" : basarili ? "Kısmen doğrulandı" : "Doğrulanamadı";
  }

  function kunyeYaz(law) {
    const parcalar = [];
    if (law.number) parcalar.push(`${law.type === "KANUN" || !law.type ? "Kanun" : baslikDuzeni(law.type)} No. ${law.number}`);
    const rgTarih = tarih(law.rg_date);
    if (rgTarih || law.rg_number) {
      parcalar.push(rgTarih && law.rg_number ? `RG ${rgTarih} / ${law.rg_number}`
        : rgTarih ? `RG ${rgTarih}` : `RG sayı ${law.rg_number} (tarih kaynakta yok)`);
    }
    if (law.mukerrer === "EVET") parcalar.push("mükerrer");
    return parcalar.join(" · ");
  }

  function metinParagraflari(item) {
    let metin = String(item.text || "");
    const bas = String(item.header || "");
    if (bas && metin.startsWith(bas)) metin = metin.slice(bas.length).trim();
    return metin.split(/\n{2,}/).map((p) => p.trim()).filter(Boolean);
  }

  function basariliMadde(item, tek) {
    const kutu = ogesi("section", "madde");
    const bas = ogesi("div", "madde-bas");
    bas.append(ogesi("span", "no", maddeEtiketi(item.madde_no || item.requested)));
    bas.append(item.heading ? ogesi("span", "baslik", item.heading) : ogesi("span", "baslik yok", "Başlıksız madde"));
    const rozet = DURUM_ROZETI[item.status];
    if (rozet) bas.append(ogesi("span", "rozet " + rozet[1], rozet[0]));
    kutu.append(bas);

    const metin = ogesi("div", "metin");
    for (const p of metinParagraflari(item)) metin.append(ogesi("p", null, p));
    kutu.append(metin);

    // Uzun madde kısaltılır; okumak isteyen tek dokunuşla açar (kartın içinde kaydırma yok).
    if ((item.chars || 0) > (tek ? 900 : 450)) {
      metin.classList.add("kisa");
      const ac = ogesi("button", "duz", "Tamamını göster");
      ac.type = "button";
      ac.setAttribute("aria-expanded", "false");
      ac.onclick = () => {
        const acik = metin.classList.toggle("kisa") === false;
        ac.textContent = acik ? "Daha az göster" : "Tamamını göster";
        ac.setAttribute("aria-expanded", String(acik));
      };
      kutu.append(ac);
    }
    if (item.truncated) {
      kutu.append(ogesi("p", "aciklama", `Metin kısaltıldı (${item.chars} karakter); tamamı resmî kaynakta.`));
    }

    const notlar = (item.annotations || []).filter(Boolean);
    if (notlar.length) {
      const sira = ogesi("div", "notlar");
      notlar.slice(0, 4).forEach((n) => sira.append(ogesi("span", "not", n)));
      if (notlar.length > 4) sira.append(ogesi("span", "not", `+${notlar.length - 4} not`));
      kutu.append(sira);
    }

    if (item.citation) {
      const atif = ogesi("div", "atif");
      const icerik = ogesi("div", "atif-icerik");
      const deger = ogesi("span", "atif-metin", item.citation);
      icerik.append(ogesi("span", "etiket", "Atıf"), deger);
      const dugme = ogesi("button", "kucuk");
      dugme.type = "button";
      dugme.append(ikon(), ogesi("span", null, "Kopyala"));
      dugme.setAttribute("aria-label", "Atfı kopyala");
      dugme.onclick = () => kopyala(item.citation, dugme, deger);
      atif.append(icerik, dugme);
      kutu.append(atif);
    }
    return kutu;
  }

  function basarisizMadde(item) {
    const kutu = ogesi("section", "madde");
    const bas = ogesi("div", "madde-bas");
    bas.append(ogesi("span", "no", maddeEtiketi(item.requested)));
    bas.append(ogesi("span", "rozet amber", item.error_code === "NOT_FOUND" ? "Bulunamadı" : "Doğrulanamadı"));
    kutu.append(bas);
    // Aracın açıklamasının ilk cümlesi yeter; kuralın kendisi aşağıdaki UYARI satırında.
    const ilk = String(item.message || "").split(/(?<=\.)\s/)[0];
    if (ilk) kutu.append(ogesi("p", "aciklama", ilk));
    kutu.append(ogesi("p", "uyari", UYARI + kaynakAdresi));
    return kutu;
  }

  function hataCiz(mesaj) {
    $("kanun").textContent = "Madde getirilemedi";
    $("kunye").textContent = "";
    kaynakAdresi = RESMI_GIRIS;
    const kutu = ogesi("section", "madde");
    kutu.append(ogesi("p", "aciklama", mesaj), ogesi("p", "uyari", UYARI + RESMI_GIRIS));
    $("govde").replaceChildren(kutu);
    durumYaz(0, 0);
    altCiz([], null);
  }

  function ciz(veri) {
    sonVeri = veri;
    const law = veri.law || {};
    const items = Array.isArray(veri.items) ? veri.items : [];
    kaynakAdresi = law.source_url || RESMI_GIRIS;

    $("kanun").textContent = law.title ? baslikDuzeni(law.title) : "Mevzuat";
    $("kunye").textContent = kunyeYaz(law);

    const tek = items.length === 1;
    const kutular = items.map((it) => (it && it.ok ? basariliMadde(it, tek) : basarisizMadde(it || {})));
    if (!kutular.length) {
      const k = ogesi("section", "madde");
      k.append(ogesi("p", "aciklama", "Araç madde döndürmedi."), ogesi("p", "uyari", UYARI + kaynakAdresi));
      kutular.push(k);
    }
    $("govde").replaceChildren(...kutular);
    const basarili = items.filter((it) => it && it.ok);
    durumYaz(basarili.length, items.length);
    altCiz(basarili, veri.fetched_at);
  }

  function altCiz(basarili, cekildi) {
    $("alt").hidden = false;
    const z = zaman(cekildi);
    $("zaman").textContent = z ? `mevzuat.gov.tr · ${z}` : "mevzuat.gov.tr";
    $("kaynak-ac").hidden = false;
    const kopya = $("hepsini-kopyala");
    kopya.hidden = basarili.length === 0;
    kopya.querySelector("span").textContent = basarili.length > 1 ? "Maddeleri kopyala" : "Metni kopyala";
    $("kart").removeAttribute("aria-busy");
  }

  // Dilekçeye yapıştırmaya hazır biçim: her madde için atıf, başlık, metin.
  function kopyaMetni() {
    if (!sonVeri) return "";
    return (sonVeri.items || [])
      .filter((it) => it && it.ok)
      .map((it) => [it.citation, it.heading ? `(${it.heading})` : "", metinParagraflari(it).join("\n")]
        .filter(Boolean).join("\n"))
      .join("\n\n");
  }

  // ---- Panoya kopyalama ----
  // Çerçeve panoya yazma iznini vermeyebilir. Önce Clipboard API, sonra eski yol; ikisi de
  // olmazsa metni seçili bırakır ve kullanıcıya elle kopyalamasını söyler.
  async function kopyala(metin, dugme, secilecek) {
    let oldu = false;
    try {
      await navigator.clipboard.writeText(metin);
      oldu = true;
    } catch {
      const t = document.createElement("textarea");
      t.value = metin;
      t.setAttribute("readonly", "");
      t.style.cssText = "position:fixed;opacity:0;pointer-events:none";
      document.body.append(t);
      t.select();
      try { oldu = document.execCommand("copy"); } catch { oldu = false; }
      t.remove();
    }
    if (!oldu && secilecek) {
      const r = document.createRange();
      r.selectNodeContents(secilecek);
      const s = getSelection();
      s.removeAllRanges();
      s.addRange(r);
    }
    const yazi = dugme.querySelector("span");
    const eski = yazi.textContent;
    yazi.textContent = oldu ? "Kopyalandı" : "Seçildi, Ctrl+C";
    $("duyuru").textContent = oldu ? "Panoya kopyalandı." : "Kopyalanamadı; metin seçildi, klavyeyle kopyalayın.";
    setTimeout(() => { yazi.textContent = eski; }, 1800);
  }

  // ---- Claude ile bağlantı ----
  const app = new App({ name: "ArthurLegal Madde Kartı", version: "1.1.0" });

  function temaUygula(ctx) {
    if (!ctx) return;
    if (ctx.theme) applyDocumentTheme(ctx.theme);
    const g = ctx.safeAreaInsets;
    if (g) {
      const kok = document.documentElement.style;
      kok.setProperty("--guvenli-ust", `${g.top || 0}px`);
      kok.setProperty("--guvenli-sag", `${g.right || 0}px`);
      kok.setProperty("--guvenli-alt", `${g.bottom || 0}px`);
      kok.setProperty("--guvenli-sol", `${g.left || 0}px`);
    }
  }

  // İşleyiciler connect()'ten önce: ilk tool-input / tool-result bildirimleri kaçmasın.
  app.ontoolinput = ({ arguments: arg }) => {
    if (sonVeri || !arg) return;
    const no = Array.isArray(arg.madde_no) ? arg.madde_no.join(", ") : (arg.madde_no || "");
    $("kunye").textContent = [arg.number ? `Kanun No. ${arg.number}` : "", no ? `m. ${no}` : ""]
      .filter(Boolean).join(" · ");
  };
  app.ontoolresult = (sonuc) => {
    const { veri, hata } = veriAl(sonuc);
    if (veri) ciz(veri); else hataCiz(hata);
  };
  app.ontoolcancelled = () => hataCiz("Araç çağrısı iptal edildi.");
  app.addEventListener("hostcontextchanged", (degisen) => temaUygula(degisen));

  $("kaynak-ac").onclick = async () => {
    try {
      await app.openLink({ url: kaynakAdresi });
    } catch {
      $("duyuru").textContent = `Bağlantı açılamadı: ${kaynakAdresi}`;
      $("zaman").textContent = kaynakAdresi;
    }
  };
  $("hepsini-kopyala").onclick = (e) => kopyala(kopyaMetni(), e.currentTarget, $("govde"));

  await app.connect();
  window.__alBagli = true;
  temaUygula(app.getHostContext());
</script>
</body>
</html>
