app = "arthurlegal-mcp"
primary_region = "ams"

[build]

# Not secrets, and deliberately visible: when semantic search misbehaves the
# first question is always which endpoint and which model were actually used.
[env]
  EMBEDDINGS_URL = "https://api.voyageai.com/v1/embeddings"
  EMBEDDINGS_MODEL = "voyage-4-lite"
  # tkgm_canli bütçesi süreç başınadır; iki makine toplamda dakikada 30 TKGM isteğini aşmasın diye
  # aralık makine sayısıyla çarpılır (tkgm-mcp/docs/MANIFESTO.md). Makine sayısı değişirse bu da değişir.
  TKGM_MAKINE_SAYISI = "2"
  # e-qanun.az does not answer from Amsterdam (10 s timeouts, 2026-10-09); the az_ tools
  # tunnel through az-relay in Frankfurt over the private network (az-relay/README.md).
  EQANUN_PROXY = "http://arthurlegal-az-relay.internal:8080"
  # Vectors kept in memory as float16 (retrieval.py) need RAM the 512 MB machine
  # does not have to spare: with 141 MB of them, free memory fell to 77-117 MB, the
  # SQLite files dropped out of the page cache, and Turkish and Polish searches went
  # from ~1.2 s to 7-8 s, keyword searches included (2026-10-10). Off on this size.
  SEMANTIC_RESIDENT_MB = "0"

[http_service]
  internal_port = 8080
  force_https = true
  # An MCP connector is not a web page: a client that reaches a stopped machine
  # gets a failed tool call, not a spinner it can wait out. The machine stays up.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "60s"
  method = "GET"
  path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  # Measured: 18 MB resident after five searches across five jurisdictions.
  # The Turkish index adds ~10k documents whose vectors are scanned per
  # semantic query; 512mb leaves that comfortable.
  memory = "512mb"
