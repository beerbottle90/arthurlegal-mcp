app = "arthurlegal-mcp"
primary_region = "ams"

[build]

# Not secrets, and deliberately visible: when semantic search misbehaves the
# first question is always which endpoint and which model were actually used.
[env]
  EMBEDDINGS_URL = "https://api.voyageai.com/v1/embeddings"
  EMBEDDINGS_MODEL = "voyage-4-lite"

[http_service]
  internal_port = 8080
  force_https = true
  # An MCP connector is not a web page: a client that reaches a stopped machine
  # gets a failed tool call, not a spinner it can wait out. The machine stays up.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "60s"
  method = "GET"
  path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  # Measured: 18 MB resident after five searches across five
  # jurisdictions. 256mb is ~14x that.
  memory = "256mb"
