# Arama doğruluk testi (kalite süreci 1).
#
# Duman testi kaynağın cevap verip vermediğine bakar; bu iş doğru kaydı getirip getirmediğine. Cevabı önceden
# bilinen sorularda (arthur-tr-hukuk-mcp/arama_kalemleri.json) beklenen karar ya da madde ilk N sonuçta mı?
# 0.8.0'a kadar içtihat araması kaynağa tarihe göre sıralatıyordu: duman testi her gün yeşildi, konuyu çözen
# kararlar ilk sayfaya gelmiyordu (mcp #70). Dil modeli kullanmaz, sır istemez.
#
# Ne zaman: her gün (duman testinden 30 dk sonra), elle, ve Bedesten kaynaklarına ya da testin kendisine dokunan
# PR'larda. Aynı test dağıtımdan önce de koşar (fly-dagitim.yml, "Arama doğruluğu (dağıtım kapısı)").
# Çıkış: 0 hepsi GECTI; 2 yalnız ERISIM (kaynak o an cevap vermedi, iş yeşil kalır, uyarı yazar);
# 1 KALDI ya da HATA (iş kırmızı). Günlük koşuda (yalnız master) düşen her kalem için tek issue açılır; aynı
# başlıklı açık issue varsa yenisi açılmaz. Fly'a ve canlı uygulamaya dokunmaz.

name: Arama doğruluğu

on:
  schedule:
    - cron: "47 4 * * *" # her gün 07:47 (Türkiye)
  workflow_dispatch:
  pull_request:
    paths:
      - "arthur-tr-hukuk-mcp/arama_dogrulugu.py"
      - "arthur-tr-hukuk-mcp/arama_kalemleri.json"
      - "arthur-tr-hukuk-mcp/sources/bedesten_*.py"
      - "arthur-tr-hukuk-mcp/server.py"
      - ".github/workflows/arama-dogrulugu.yml"

permissions:
  contents: read
  issues: write

concurrency:
  group: arama-dogrulugu-${{ github.ref }}
  cancel-in-progress: false

jobs:
  arama:
    name: Bilinen sorularda doğru kayıt
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: arthur-tr-hukuk-mcp
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11" # Dockerfile: python:3.11-slim

      - name: Paketler
        run: pip install "pypdf==6.21.4" # testler.yml ile aynı sürüm

      - name: Arka ucu başlat (127.0.0.1:8000)
        run: |
          python server.py --transport http --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/sunucu.log" 2>&1 &
          for i in $(seq 1 30); do
            if python -c "import socket; socket.create_connection(('127.0.0.1', 8000), 1)" 2>/dev/null; then
              echo "sunucu hazır"; exit 0
            fi
            sleep 1
          done
          echo "sunucu 30 sn içinde açılmadı"; cat "$RUNNER_TEMP/sunucu.log"; exit 1

      - name: Arama doğruluğu
        id: test
        run: |
          set +e
          python arama_dogrulugu.py --url http://127.0.0.1:8000/mcp --json "$RUNNER_TEMP/arama.json"
          kod=$?
          {
            echo "## Arama doğruluğu"
            echo
            echo '```json'
            cat "$RUNNER_TEMP/arama.json" 2>/dev/null || echo "sonuç dosyası yok"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$kod" -eq 2 ]; then
            echo "::warning::Yalnız ERISIM: kaynak o an cevap vermedi, sıralama ölçülemedi (yarın yeniden)."
            exit 0
          fi
          exit $kod

      - name: Issue (düşen kalem başına)
        if: failure() && steps.test.outcome == 'failure' && github.event_name == 'schedule' && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          KOSU: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          idler=$(python -c "import json,sys; print(' '.join(s['id'] for s in json.load(open(sys.argv[1], encoding='utf-8'))['sonuclar'] if s['sinif'] in ('KALDI', 'HATA')))" "$RUNNER_TEMP/arama.json")
          for id in $idler; do
            baslik="Arama doğruluğu düştü: $id"
            if gh issue list --state open --search "\"$baslik\" in:title" --json title --jq '.[].title' | grep -Fxq "$baslik"; then
              echo "açık issue var: $baslik"; continue
            fi
            gh issue create --title "$baslik" \
              --body "$(python arama_dogrulugu.py --json "$RUNNER_TEMP/arama.json" --issue-govdesi "$id" --kosu "$KOSU")"
          done

      - name: Sunucu günlüğü (hata olursa)
        if: failure()
        run: tail -200 "$RUNNER_TEMP/sunucu.log"
